<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>卡牌图片批量识别 · Bindarr</title>
  <style>
    :root{color-scheme:dark;--bg:#07101f;--panel:#101a2d;--line:#26344f;--text:#f5f7fb;--muted:#9aa9c1;--red:#ff5358;--green:#34d399}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17233c 0,#07101f 45%);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}
    main{max-width:1120px;margin:auto;padding:28px 20px 80px}a{color:#b9c9e8;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    h1{font-size:28px;margin:0 0 6px}.lead{color:var(--muted);margin:0}.panel{background:rgba(16,26,45,.94);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 18px 55px #0005}
    .drop{display:grid;place-items:center;min-height:210px;border:2px dashed #435274;border-radius:15px;text-align:center;padding:22px;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--red);background:#ff53580b}
    input[type=file]{display:none}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:11px;padding:12px 20px;font-weight:750;cursor:pointer;color:white;background:#24314b}button.primary{background:var(--red);box-shadow:0 9px 25px #ff535833}button:disabled{opacity:.45;cursor:not-allowed}
    #preview{max-width:220px;max-height:300px;border-radius:9px;display:none}.status{color:var(--muted)}.summary{display:flex;gap:22px;align-items:end;flex-wrap:wrap}.metric strong{display:block;font-size:26px}.metric span{color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px;margin-top:18px}.card{display:grid;grid-template-columns:74px 1fr;gap:12px;border:1px solid var(--line);border-radius:13px;padding:11px;background:#0b1426}.card img{width:74px;height:104px;object-fit:cover;border-radius:6px;background:#192238}
    select,input[type=number],input[type=text]{width:100%;background:#091223;color:var(--text);border:1px solid #35435e;border-radius:8px;padding:9px}.qty{display:flex;gap:8px;margin-top:8px}.qty label{color:var(--muted);white-space:nowrap}.confidence{font-size:12px;color:var(--muted);margin-top:6px}.low{color:#fbbf24}.success{color:var(--green)}
    .create{display:grid;grid-template-columns:minmax(190px,1fr) minmax(190px,1fr) auto auto;gap:12px;margin-top:18px}.field-label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field-label input,.field-label select{font-size:15px;color:var(--text)}@media(max-width:820px){.create{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="top"><div><h1>从图片批量识别卡牌</h1><p class="lead">支持集换社导出的完整卡组图；识别后可以创建卡组，也可以批量加入 Collection。</p></div><a href="/">← 返回 Bindarr</a></div>
  <section class="panel">
    <label class="drop" id="drop"><div><div style="font-size:42px">▧</div><strong>选择或拖入卡组图片</strong><div class="status">PNG、JPG，建议使用原始导出图</div></div><img id="preview" alt="卡组图片预览"></label>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="actions"><button class="primary" id="recognize" disabled>识别卡组</button><span class="status" id="status">尚未选择图片</span></div>
  </section>
  <section class="panel" id="result" hidden>
    <div class="summary"><div class="metric"><strong id="types">0</strong><span>卡牌种类</span></div><div class="metric"><strong id="total">0</strong><span>合计张数</span></div><div class="status">请检查黄色提示项；可以切换到其他 CN 候选版本。</div></div>
    <div class="cards" id="cards"></div>
    <div class="create">
      <label class="field-label">卡组名称<input id="deckName" type="text" value="图片导入卡组" maxlength="100"></label>
      <label class="field-label">加入 Collection 的 Location<select id="location"><option value="">未分类 / Unassigned</option></select></label>
      <button class="primary" id="addCollection">批量加入 Collection</button>
      <button class="primary" id="create">创建卡组</button>
    </div>
  </section>
</main><script>
  const $=id=>document.getElementById(id);let imageData='',recognized=null;
  const authHeaders=()=>{const token=localStorage.getItem('bindarr_token');return {'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}};
  const selectedCards=()=>recognized.cards.map(row=>({card_id:row.candidates[row.selected||0].card.id,quantity:row.quantity}));
  async function loadLocations(){try{const r=await fetch('/api/locations',{headers:authHeaders()});if(!r.ok)return;const rows=await r.json();for(const loc of rows){const o=document.createElement('option');o.value=loc.id;o.textContent=loc.name;$('location').appendChild(o)}}catch{}}
  loadLocations();
  function setFile(file){if(!file)return;if(file.size>12*1024*1024){$('status').textContent='图片不能超过 12 MB';return}const r=new FileReader;r.onload=()=>{imageData=r.result;$('preview').src=imageData;$('preview').style.display='block';$('drop').firstElementChild.style.display='none';$('recognize').disabled=false;$('status').textContent=file.name};r.readAsDataURL(file)}
  $('drop').onclick=()=>$('file').click();$('file').onchange=e=>setFile(e.target.files[0]);
  for(const ev of ['dragenter','dragover'])$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('drag')});
  for(const ev of ['dragleave','drop'])$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('drag')});$('drop').addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
  function displayName(card){return card.printed_name||card.name||card.id}
  function render(){const box=$('cards');box.textContent='';recognized.cards.forEach((row,i)=>{const wrap=document.createElement('div');wrap.className='card';const img=document.createElement('img');const detail=document.createElement('div');const select=document.createElement('select');row.candidates.forEach((candidate,n)=>{const o=document.createElement('option');o.value=n;o.textContent=`${displayName(candidate.card)} · ${candidate.card.set_name||candidate.card.set_id||''} #${candidate.card.number||''}`;select.appendChild(o)});const q=document.createElement('div');q.className='qty';q.innerHTML='<label>数量</label>';const input=document.createElement('input');input.type='number';input.min=1;input.max=99;input.value=row.quantity;q.appendChild(input);const conf=document.createElement('div');conf.className='confidence '+(row.candidates[0].confidence<.04?'low':'');conf.textContent=row.candidates[0].confidence<.04?'版本接近，请人工确认':'CN 卡图匹配较清楚';function chosen(){const c=row.candidates[Number(select.value)];img.src=c.card.image_url||'';img.alt=displayName(c.card);row.selected=Number(select.value)}select.onchange=chosen;input.onchange=()=>{row.quantity=Math.max(1,Number(input.value)||1);updateTotal()};detail.append(select,q,conf);wrap.append(img,detail);box.appendChild(wrap);chosen()});$('types').textContent=recognized.cards.length;updateTotal();$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth'})}
  function updateTotal(){$('total').textContent=recognized.cards.reduce((s,x)=>s+x.quantity,0)}
  $('recognize').onclick=async()=>{const b=$('recognize');b.disabled=true;$('status').textContent='正在切分卡位并匹配 11,946 张 CN 卡图…';try{const r=await fetch('/api/decks/image/recognize',{method:'POST',headers:authHeaders(),body:JSON.stringify({image:imageData})});const j=await r.json();if(!r.ok)throw Error(r.status===401?'登录已失效，请返回 Bindarr 重新登录':j.error||'识别失败');recognized=j;render();$('status').textContent=`识别完成：${j.cards.length} 种，共 ${j.total} 张`}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
  $('addCollection').onclick=async()=>{const b=$('addCollection');b.disabled=true;b.textContent='正在加入…';try{const r=await fetch('/api/collection/image-add',{method:'POST',headers:authHeaders(),body:JSON.stringify({cards:selectedCards(),location_id:$('location').value||null,language:'Chinese (Simplified)',condition:'Near Mint',printing:'Normal'})});const j=await r.json();if(!r.ok)throw Error(j.error||'加入失败');b.textContent=`已加入 ${j.total} 张`;b.classList.add('success');$('status').textContent=`完成：${j.types} 种、${j.total} 张卡已加入 Collection`;}catch(e){alert(e.message);b.disabled=false;b.textContent='批量加入 Collection'}};
  $('create').onclick=async()=>{const b=$('create');b.disabled=true;b.textContent='正在创建…';try{const r=await fetch('/api/decks/image/create',{method:'POST',headers:authHeaders(),body:JSON.stringify({name:$('deckName').value,cards:selectedCards()})});const j=await r.json();if(!r.ok)throw Error(j.error||'创建失败');b.textContent=`已创建 ${j.total} 张`;b.classList.add('success');setTimeout(()=>location.href='/',700)}catch(e){alert(e.message);b.disabled=false;b.textContent='创建卡组'}};
</script></body></html>
