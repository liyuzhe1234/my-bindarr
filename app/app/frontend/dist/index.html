    <!-- Apply saved theme before first paint so there's no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          const urlTheme = new URLSearchParams(window.location.search).get('theme');
          document.documentElement.setAttribute('data-theme', urlTheme || localStorage.getItem('theme') || 'dark');
        } catch (e) { /* private mode / storage blocked: stay on dark */ }
      })();
    </script>
    <script>
      (function () {
        var armed = true;
        function preferSearchAdd() {
          var tabs = document.querySelector('.sub-nav-tabs');
          if (!tabs) { armed = true; return; }
          if (!armed) return;
          var buttons = tabs.querySelectorAll('button');
          if (buttons.length >= 2 && !buttons[1].classList.contains('active')) {
            buttons[1].click();
          }
          armed = false;
        }
        new MutationObserver(preferSearchAdd).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', preferSearchAdd);
      })();
    </script>
